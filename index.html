<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexus Voice</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#080808;
color:white;
height:100vh;
}

#loginScreen{
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.card{
width:350px;
background:#111;
border:2px solid #a020f0;
border-radius:20px;
padding:30px;
box-shadow:0 0 25px #a020f0;
}

.card h1{
text-align:center;
margin-bottom:20px;
color:#c56cff;
}

.card input{
width:100%;
padding:12px;
margin-bottom:12px;
background:#1a1a1a;
border:none;
border-radius:10px;
color:white;
}

.card button{
width:100%;
padding:12px;
margin-top:10px;
background:#a020f0;
border:none;
border-radius:10px;
color:white;
cursor:pointer;
}

#app{
display:none;
height:100vh;
flex-direction:column;
}

header{
height:70px;
background:#111;
border-bottom:2px solid #a020f0;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
}

#main{
flex:1;
display:flex;
}

#users{
width:250px;
background:#111;
padding:15px;
border-right:2px solid #a020f0;
overflow:auto;
}

#userList{
list-style:none;
}

#userList li{
background:#1b1b1b;
padding:10px;
margin-bottom:8px;
border-radius:10px;
}

#chatArea{
flex:1;
display:flex;
flex-direction:column;
}

#messages{
flex:1;
padding:20px;
overflow:auto;
}

.message{
background:#151515;
padding:10px;
margin-bottom:10px;
border-radius:10px;
}

.user{
color:#c56cff;
font-weight:bold;
}

#messageBox{
display:flex;
padding:15px;
gap:10px;
border-top:2px solid #a020f0;
}

#messageInput{
flex:1;
padding:12px;
background:#1a1a1a;
border:none;
border-radius:10px;
color:white;
}

#sendBtn{
width:120px;
background:#a020f0;
border:none;
border-radius:10px;
color:white;
}

footer{
height:70px;
background:#111;
border-top:2px solid #a020f0;
display:flex;
justify-content:center;
align-items:center;
gap:20px;
}

#muteBtn{
padding:12px 20px;
background:#a020f0;
border:none;
border-radius:10px;
color:white;
}

</style>
</head>
<body>

<div id="loginScreen">

<div class="card">

<h1>NEXUS VOICE</h1>

<input
id="username"
placeholder="Seu nome">

<input
id="room"
placeholder="Código da sala">

<button id="createRoomBtn">
🚀 Criar Sala
</button>

<button id="joinBtn">
🎧 Entrar na Sala
</button>

</div>

</div>

<div id="app">

<header>
<h2>NEXUS VOICE</h2>
<div id="roomName"></div>
</header>

<div id="main">

<aside id="users">
<h3>Participantes</h3>
<ul id="userList"></ul>
</aside>

<section id="chatArea">

<div id="messages"></div>

<div id="messageBox">

<input
id="messageInput"
placeholder="Mensagem">

<button id="sendBtn">
Enviar
</button>

</div>

</section>

</div>

<footer>

<button id="muteBtn">
🎤 Mutar
</button>

<span>
Conectado
</span>

</footer>

</div>

<script>

function generateRoomCode(){

const chars =
"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

let code = "";

for(let i=0;i<6;i++){

code += chars[
Math.floor(
Math.random() *
chars.length
)
];

}

return code;

}

document
.getElementById("createRoomBtn")
.onclick = () => {

const roomCode =
generateRoomCode();

document
.getElementById("room")
.value = roomCode;

alert(
"Sala criada!\n\nCódigo: " +
roomCode
);

};

</script>

</body>
</html>
