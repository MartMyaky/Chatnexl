<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexus Voice</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div id="loginScreen">

    <div class="card">

        <h1>NEXUS VOICE</h1>

        <input
            id="username"
            placeholder="Seu nome"
        >

        <input
            id="room"
            placeholder="Código da sala"
        >

        <button id="joinBtn">
            Entrar
        </button>

    </div>

</div>

<div id="app" style="display:none;">

    <header>

        <h2>NEXUS VOICE</h2>

        <div id="roomName">
            Sala
        </div>

    </header>

    <div id="main">

        <aside id="users">

            <h3>Participantes</h3>

            <ul id="userList"></ul>

        </aside>

        <section id="chatArea">

            <div id="messages"></div>

            <div id="messageBox">

                <input
                    id="messageInput"
                    placeholder="Digite uma mensagem..."
                >

                <button id="sendBtn">
                    Enviar
                </button>

            </div>

        </section>

    </div>

    <footer>

        <button id="muteBtn">
            🎤 Mutar
        </button>

        <span id="status">
            Conectado
        </span>

    </footer>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
